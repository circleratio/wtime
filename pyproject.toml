[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wtime"
description = "CLI world clock tool"
readme = "doc/requirement.md"
requires-python = ">=3.9"
dynamic = ["version"]

[project.scripts]
wtime = "wtime.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.dynamic]
version = { attr = "wtime.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
